name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Lint (ktlint)
        run: ./gradlew lintKotlin

      - name: kore-core API compatibility check (KORE-02)
        run: ./gradlew :kore-core:apiCheck --no-configuration-cache

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test

  arm64-build:
    runs-on: ubuntu-24.04-arm
    needs: build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build
        run: ./gradlew build

  integration-test:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Docker pre-flight (CI-02 / D-14)
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error title=Docker unavailable::Docker daemon is not reachable on this runner. This is a RUNNER CONFIG ERROR, not a test failure — integration tests need Docker for Testcontainers."
            exit 1
          fi
          echo "Docker daemon reachable."

      - name: Integration tests (CI-01)
        run: ./gradlew :kore-storage:integrationTest
